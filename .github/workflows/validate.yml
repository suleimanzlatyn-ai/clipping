name: Clip Studio validation
on:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check API files
        run: |
          node --check api/analyze.js
          node --check api/upload.js
          node -e "const fs=require('fs'); const h=fs.readFileSync('index.html','utf8'); const m=h.match(/<script type=\"module\">([\\s\\S]*?)<\\/script>/); if(!m) throw new Error('module script missing'); fs.writeFileSync('/tmp/index-module.mjs',m[1]);"
          node --check /tmp/index-module.mjs
      - name: Validate JSON files
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json OK')"
