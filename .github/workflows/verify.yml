name: Verify clipping backend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Parse analyze route
        run: node -e "const fs=require('fs'); new Function(fs.readFileSync('api/analyze.js','utf8')); console.log('analyze.js parse OK')"
      - name: Parse job route
        run: node -e "const fs=require('fs'); new Function(fs.readFileSync('api/jobs/[id].js','utf8')); console.log('jobs route parse OK')"
      - name: Validate package
        run: node -e "const p=require('./package.json'); if(!p.dependencies['@google/genai']) throw new Error('Missing @google/genai'); if(!p.dependencies['@vercel/sandbox']) throw new Error('Missing @vercel/sandbox'); console.log('package OK')"
