name: Verify clipping backend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check api/analyze.js
      - run: node --check 'api/jobs/[id].js'
      - run: node -e "const p=require('./package.json'); if(!p.dependencies['@google/genai']) process.exit(1)"
