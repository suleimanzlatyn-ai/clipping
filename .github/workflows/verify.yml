name: Verify clipping backend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Parse API routes
        run: |
          node -e "const fs=require('fs'); new Function(fs.readFileSync('api/analyze.js','utf8')); new Function(fs.readFileSync('api/jobs/[id].js','utf8')); console.log('API syntax OK')"
      - name: Load API routes
        run: |
          node -e "const a=require('./api/analyze.js'); if(typeof a!=='function') throw new Error('analyze handler missing'); const j=require('./api/jobs/[id].js'); if(typeof j!=='function') throw new Error('job handler missing'); console.log('API modules load OK')"
      - name: Validate package
        run: |
          node -e "const p=require('./package.json'); for(const x of ['@google/genai','@vercel/sandbox','openai']) if(!p.dependencies[x]) throw new Error('Missing '+x); console.log('package OK')"
